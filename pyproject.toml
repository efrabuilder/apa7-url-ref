[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apa7ref"
version = "0.1.0"
description = "Genera referencias en formato APA 7 a partir de URLs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Efrain" }]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
apa7ref = "apa7ref.cli:main"

[tool.setuptools.packages.find]
include = ["apa7ref*"]
